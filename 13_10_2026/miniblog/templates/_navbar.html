{% set menu = [
    ('index', 'Trang chủ'),
    ('posts', 'Bài viết'),
    ('categories', 'Danh mục'),
    ('about', 'Giới thiệu'),
    ('contact', 'Liên hệ')
] %}

<nav class="navbar navbar-expand-md navbar-dark" style="background-color: #1b3d82;">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu"
            aria-controls="mainMenu" aria-expanded="false" aria-label="Mở menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="mainMenu">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                {% for endpoint, label in menu %}
                <li class="nav-item">
                    <a class="nav-link px-3 {{ 'active bg-primary rounded' if request.endpoint == endpoint }}" 
                       href="{{ url_for(endpoint) if endpoint == 'index' else '#' }}">
                        {{ label }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
