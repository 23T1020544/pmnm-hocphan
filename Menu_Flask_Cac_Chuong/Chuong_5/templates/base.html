<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ứng Dụng Flask{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        .navbar {
            background-color: #2c3e50;
            overflow: hidden;
            padding: 0 20px;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-weight: bold;
        }
        .navbar a:hover {
            background-color: #34495e;
        }
        .navbar a.active {
            background-color: #4CAF50;
        }
        .container {
            padding: 30px;
            display: flex;
            justify-content: center;
        }
        .khung-chuc-nang {
            width: 420px;
            background-color: white;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nhom-nhap-lieu {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .thong-bao-loi {
            color: red;
            font-size: 0.85em;
            margin-top: 4px;
        }
        .ket-qua {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.05em;
            line-height: 1.5;
        }
        .ket-qua-xanh {
            background-color: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #2e7d32;
        }
        .ket-qua-vang {
            background-color: #fffde7;
            border: 1px solid #fff9c4;
            color: #f57f17;
        }
        .ket-qua-do {
            background-color: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{{ url_for('calculator') }}" class="{% if request.path == '/' %}active{% endif %}">Bài 1: Máy tính</a>
        <a href="{{ url_for('tinh_diem_hoc_phan') }}" class="{% if request.path == '/tinh-diem' %}active{% endif %}">Bài 2: Tính điểm</a>
        <a href="{{ url_for('tinh_bmi') }}" class="{% if request.path == '/bmi' %}active{% endif %}">Bài 3: Tính BMI</a>
    </div>

    <div class="container">
        <div class="khung-chuc-nang">
            {% block content %}{% endblock %}
        </div>
    </div>

</body>
</html>
