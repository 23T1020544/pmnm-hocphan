<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Trang chủ{% endblock %} - {{ site_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="fw-bold display-4">{{ site_name }}</h1>
            <p class="lead mb-0">Chia sẻ kiến thức và kinh nghiệm học tập</p>
        </div>
    </header>

    {% include "_navbar.html" %}

    <main class="container py-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top py-4 text-center text-muted small mt-auto">
        <div class="container">
            <p class="mb-1">&copy; {{ current_year }} <strong>{{ site_name }}</strong>. Tất cả quyền được bảo lưu.</p>
            <p class="mb-0">Học phần Phần mềm mã nguồn mở | Tổng số bài viết: {{ post_count }}</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
